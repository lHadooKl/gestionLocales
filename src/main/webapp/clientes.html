<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestión de Clientes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script defer src="js/clientes.js"></script>
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Sistema de Inventario</a>
      <a class="btn btn-light btn-sm" href="index.html">Inicio</a>
    </div>
  </nav>

  <div class="container">
    <h2 class="mb-3 text-center text-primary">Gestión de Clientes</h2>

    <!-- Formulario -->
    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <h5 class="card-title mb-3">Registrar Cliente</h5>
        <form id="clienteForm" class="row g-3">
          <div class="col-md-6">
            <input type="text" id="nombre" class="form-control" placeholder="Nombre" required>
          </div>
          <div class="col-md-6">
            <input type="text" id="direccion" class="form-control" placeholder="Dirección" required>
          </div>
          <div class="col-md-6">
            <input type="text" id="telefono" class="form-control" placeholder="Teléfono" required>
          </div>
          <div class="col-md-6">
            <input type="email" id="email" class="form-control" placeholder="Correo" required>
          </div>
          <div class="col-12 text-end">
            <button type="submit" class="btn btn-success">Guardar</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Tabla -->
    <div class="card shadow-sm">
      <div class="card-body">
        <h5 class="card-title mb-3">Lista de Clientes</h5>
        <table class="table table-striped table-hover" id="tablaClientes">
          <thead class="table-primary">
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Dirección</th>
              <th>Teléfono</th>
              <th>Email</th>
              <th>Acción</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
