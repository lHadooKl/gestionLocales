<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Gestión de Productos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script defer src="js/productos.js"></script>
</head>
<body class="bg-light">
  <div class="container py-4">
    <header class="d-flex justify-content-between align-items-center mb-4">
      <h1 class="h3">Gestión de Productos</h1>
      <a href="index.html" class="btn btn-secondary">Volver al inicio</a>
    </header>

    <section class="mb-5">
      <h2 class="h4 mb-3">Registrar Producto</h2>
      <form id="productoForm" class="row g-3">
        <div class="col-md-6">
          <input type="text" id="nombre" class="form-control" placeholder="Nombre" required>
        </div>
        <div class="col-md-6">
          <input type="text" id="descripcion" class="form-control" placeholder="Descripción" required>
        </div>
        <div class="col-md-4">
          <input type="number" id="precio" step="0.01" class="form-control" placeholder="Precio" required>
        </div>
        <div class="col-md-4">
          <input type="number" id="stock" class="form-control" placeholder="Stock" required>
        </div>
        <div class="col-md-4">
          <input type="number" id="idProveedor" class="form-control" placeholder="ID Proveedor" required>
        </div>
        <div class="col-12">
          <button type="submit" class="btn btn-primary w-100">Guardar Producto</button>
        </div>
      </form>
    </section>

    <section>
      <h2 class="h4 mb-3">Lista de Productos</h2>
      <div class="table-responsive">
        <table class="table table-bordered table-striped align-middle" id="tablaProductos">
          <thead class="table-dark">
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Descripción</th>
              <th>Precio</th>
              <th>Stock</th>
              <th>ID Proveedor</th>
              <th>Acción</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
