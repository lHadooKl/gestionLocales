<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pedidos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-4">
    
    
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">Inventario Local</a>
            <div>
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="productos.html">Productos</a></li>
                    <li class="nav-item"><a class="nav-link" href="proveedores.html">Proveedores</a></li>
                    <li class="nav-item"><a class="nav-link" href="clientes.html">Clientes</a></li>
                    <li class="nav-item"><a class="nav-link" href="pedidos.html">Pedidos</a></li>
                    <li class="nav-item"><a class="nav-link" href="detalles_pedido.html">Detalles Pedido</a></li>
                    <li class="nav-item"><a class="nav-link" href="historial.html">Historial</a></li>
                </ul>
            </div>
        </div>
    </nav>
    
    
    <h2>Gestión de Pedidos</h2>
    <form id="pedidoForm" class="mb-4">
        <div class="row g-2">
            <div class="col"><input type="number" id="id_cliente" placeholder="ID Cliente" class="form-control" required></div>
            <div class="col"><input type="date" id="fecha_pedido" class="form-control" required></div>
            <div class="col">
                <select id="estado" class="form-select">
                    <option value="pendiente">Pendiente</option>
                    <option value="en proceso">En Proceso</option>
                    <option value="entregado">Entregado</option>
                </select>
            </div>
            <div class="col"><button class="btn btn-primary w-100">Guardar</button></div>
        </div>
    </form>

    <table class="table table-striped">
        <thead class="table-dark">
            <tr><th>ID</th><th>Cliente</th><th>Fecha</th><th>Estado</th><th>Acciones</th></tr>
        </thead>
        <tbody id="tablaPedidos"></tbody>
    </table>
</div>
<script src="js/pedidos.js"></script>
<script src="js/app.js"></script>
</body>
</html>
