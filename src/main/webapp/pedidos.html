<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestión de Pedidos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script defer src="js/pedidos.js"></script>
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Sistema de Inventario</a>
      <a class="btn btn-light btn-sm" href="index.html">Inicio</a>
    </div>
  </nav>

  <div class="container">
    <h2 class="mb-3 text-center text-primary">Gestión de Pedidos</h2>

    <!-- Formulario -->
    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <h5 class="card-title mb-3">Registrar Pedido</h5>
        <form id="pedidoForm" class="row g-3">
          <div class="col-md-4">
            <input type="number" id="id_cliente" class="form-control" placeholder="ID Cliente" required>
          </div>
          <div class="col-md-4">
            <input type="date" id="fecha_pedido" class="form-control" required>
          </div>
          <div class="col-md-4">
            <select id="estado" class="form-select" required>
              <option value="">Seleccionar estado</option>
              <option value="pendiente">Pendiente</option>
              <option value="en proceso">En proceso</option>
              <option value="entregado">Entregado</option>
            </select>
          </div>
          <div class="col-12 text-end">
            <button type="submit" class="btn btn-success">Guardar</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Tabla -->
    <div class="card shadow-sm">
      <div class="card-body">
        <h5 class="card-title mb-3">Lista de Pedidos</h5>
        <table class="table table-striped table-hover" id="tablaPedidos">
          <thead class="table-primary">
            <tr>
              <th>ID</th>
              <th>Cliente</th>
              <th>Fecha</th>
              <th>Estado</th>
              <th>Acción</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
