<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Detalles de Pedido</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script defer src="js/detalles_pedido.js"></script>
</head>
<body class="bg-light">
  <div class="container py-4">
    <header class="d-flex justify-content-between align-items-center mb-4">
      <h1 class="h3">Gestión de Detalles de Pedido</h1>
      <a href="index.html" class="btn btn-secondary">Volver al inicio</a>
    </header>

    <!-- Formulario para agregar detalle -->
    <section class="mb-5">
      <h2 class="h4 mb-3">Registrar Detalle</h2>
      <form id="detalleForm" class="row g-3">
        <div class="col-md-3">
          <input type="number" id="idPedido" class="form-control" placeholder="ID Pedido" required>
        </div>
        <div class="col-md-3">
          <input type="number" id="idProducto" class="form-control" placeholder="ID Producto" required>
        </div>
        <div class="col-md-3">
          <input type="number" id="cantidad" class="form-control" placeholder="Cantidad" required>
        </div>
        <div class="col-md-3">
          <input type="number" id="precioUnitario" class="form-control" step="0.01" placeholder="Precio Unitario" required>
        </div>
        <div class="col-12">
          <button type="submit" class="btn btn-primary w-100">Guardar Detalle</button>
        </div>
      </form>
    </section>

    <!-- Tabla de detalles -->
    <section>
      <h2 class="h4 mb-3">Lista de Detalles</h2>
      <div class="table-responsive">
        <table class="table table-bordered table-striped align-middle" id="tablaDetalles">
          <thead class="table-dark">
            <tr>
              <th>ID Detalle</th>
              <th>ID Pedido</th>
              <th>ID Producto</th>
              <th>Cantidad</th>
              <th>Precio Unitario</th>
              <th>Acción</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
