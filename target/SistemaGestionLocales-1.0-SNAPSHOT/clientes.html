    <h2>Gestión de Clientes</h2>
    <form id="clienteForm" class="mb-4">
        <div class="row g-2">
            <div class="col"><input type="text" id="nombre" placeholder="Nombre" class="form-control" required></div>
            <div class="col"><input type="text" id="direccion" placeholder="Dirección" class="form-control"></div>
            <div class="col"><input type="text" id="telefono" placeholder="Teléfono" class="form-control"></div>
            <div class="col"><input type="email" id="email" placeholder="Email" class="form-control"></div>
            <div class="col"><button class="btn btn-primary w-100">Guardar</button></div>
        </div>
    </form>

    <table class="table table-striped">
        <thead class="table-dark">
            <tr><th>ID</th><th>Nombre</th><th>Dirección</th><th>Teléfono</th><th>Email</th><th>Acciones</th></tr>
