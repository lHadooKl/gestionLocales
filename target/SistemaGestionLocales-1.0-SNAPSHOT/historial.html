<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Historial de Entregas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script defer src="js/historial_entregas.js"></script>
</head>
<body class="bg-light">
  <div class="container py-4">
    <header class="d-flex justify-content-between align-items-center mb-4">
      <h1 class="h3">Historial de Entregas</h1>
      <a href="index.html" class="btn btn-secondary">Volver al inicio</a>
    </header>

    <section class="mb-5">
      <h2 class="h4 mb-3">Registrar Entrega</h2>
      <form id="entregaForm" class="row g-3">
        <div class="col-md-4">
          <input type="number" id="idPedido" class="form-control" placeholder="ID Pedido" required>
        </div>
        <div class="col-md-4">
          <input type="date" id="fechaEntrega" class="form-control" required>
        </div>
        <div class="col-md-4">
          <select id="estadoEntrega" class="form-select" required>
            <option value="">Seleccione estado</option>
            <option value="En camino">En camino</option>
            <option value="Entregado">Entregado</option>
            <option value="Devuelto">Devuelto</option>
          </select>
        </div>
        <div class="col-12">
          <button type="submit" class="btn btn-primary w-100">Guardar Entrega</button>
        </div>
      </form>
    </section>

    <section>
      <h2 class="h4 mb-3">Lista de Entregas</h2>
      <div class="table-responsive">
        <table class="table table-bordered table-striped align-middle" id="tablaEntregas">
          <thead class="table-dark">
            <tr>
              <th>ID</th>
              <th>ID Pedido</th>
              <th>Fecha Entrega</th>
              <th>Estado</th>
              <th>Acción</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
