<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Historial de Entregas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-4">
    
    
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">Inventario Local</a>
            <div>
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="productos.html">Productos</a></li>
                    <li class="nav-item"><a class="nav-link" href="proveedores.html">Proveedores</a></li>
                    <li class="nav-item"><a class="nav-link" href="clientes.html">Clientes</a></li>
                    <li class="nav-item"><a class="nav-link" href="pedidos.html">Pedidos</a></li>
                    <li class="nav-item"><a class="nav-link" href="detalles_pedido.html">Detalles Pedido</a></li>
                    <li class="nav-item"><a class="nav-link" href="historial.html">Historial</a></li>
                </ul>
            </div>
        </div>
    </nav>
    
    <h2>Historial de Entregas</h2>
    <form id="historialForm" class="mb-4">
        <div class="row g-2">
            <div class="col"><input type="number" id="id_pedido" placeholder="ID Pedido" class="form-control" required></div>
            <div class="col"><input type="date" id="fecha_entrega" class="form-control" required></div>
            <div class="col"><input type="text" id="estado_entrega" placeholder="Estado" class="form-control" required></div>
            <div class="col"><button class="btn btn-primary w-100">Guardar</button></div>
        </div>
    </form>

    <table class="table table-striped">
        <thead class="table-dark">
            <tr><th>ID</th><th>Pedido</th><th>Fecha</th><th>Estado</th><th>Acciones</th></tr>
        </thead>
        <tbody id="tablaHistorial"></tbody>
    </table>
</div>
<script src="js/historial.js"></script>
<script src="js/app.js"></script>
</body>
</html>
